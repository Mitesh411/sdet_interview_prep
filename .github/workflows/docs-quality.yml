name: Docs quality

# Lint Markdown, check links, and spell-check on every pull request.
# Can also be started by hand from the Actions tab (Run workflow).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Rules: .markdownlint-cli2.jsonc
      - run: npx --yes markdownlint-cli2@0.18.1

  spellcheck:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Config: cspell.json · custom dictionary: .cspell/tech-words.txt
      - run: npx --yes cspell@9.1.3 lint --no-progress --show-suggestions "**/*.md"

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Config: lychee.toml (checks relative links, #anchors and external URLs)
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress "./**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
