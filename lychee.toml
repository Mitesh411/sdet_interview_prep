# lychee link checker configuration (used by .github/workflows/docs-quality.yml)

# Check #heading anchors in links, not only that the file or URL exists.
# Since lychee v0.24 this is a mode, not a boolean: "none" | "anchor-only" | "text-only" | "full".
# This repo only uses heading anchors (#section), not text fragments (#:~:text=...).
include_fragments = "anchor-only"

# Be tolerant of slow or rate-limiting sites so PRs don't fail on transient errors.
max_retries = 3
retry_wait_time = 5
timeout = 30
max_concurrency = 8
accept = ["200..=299", "403", "429"]

exclude = [
  # Placeholder URLs used inside code samples.
  '^https?://([a-z0-9-]+\.)*example\.(com|org)',
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  # Sites that block automated clients.
  '^https?://(www\.)?linkedin\.com',
]

# Regular expressions matched against file paths.
exclude_path = ['(^|/)node_modules/', '(^|/)\.git/']
